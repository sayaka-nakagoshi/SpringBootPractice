<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>【管理者用】アカウント新規登録</title>
</head>

<body>
	<h1>登録内容</h1>
<!-- th:objectで記述しているsignupFormは、Controllerの@ModelAttribute("signupForm")の一致させる必要あり -->
	<form th:action="@{/admin/signup}" th:object="${signupForm}" method="post">
		<table border="1">
			<tr>
				<td>姓</td>
				<td>
					<input type="text" th:field="*{lastName}">
					<span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color:red"></span>
				</td>
			</tr>
			<tr>
				<td>名</td>
				<td>
					<input type="text" th:field="*{firstName}">
					<span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color:red"></span>
				</td>
			</tr>
			<tr>
				<td>メールアドレス</td>
				<td>
					<input type="email" th:field="*{email}">
					<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></span>
				</td>
			</tr>
			<tr>
				<td>パスワード</td>
				<td>
					<input type="password" th:field="*{password}">
					<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red"></span>
				</td>
			</tr>
		</table>
		<button type="submit">確認</button>
		<a th:href="@{/admin/signup/register}">確認</a>
	</form>
</body>

</html>
