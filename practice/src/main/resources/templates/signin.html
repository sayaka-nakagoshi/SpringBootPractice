<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>【管理者用】ログイン画面</title>
</head>

<body>
	<h1>ログイン画面</h1>
	<form th:action="signup" method="post">
		<table border="1">
			<tr>
				<td>メールアドレス</td>
				<td>
					<span th:text="${email}"></span>
				</td>
			</tr>
			<tr>
				<td>パスワード</td>
				<td>
					<span th:password="${password}"></span>
				</td>
			</tr>
		</table>
		<input type="submit" value="確認">
		
		<p>アカウント登録をお持ちでない場合 <a href="signup.html">登録はこちら</a></p>
	</form>
</body>

</html>
